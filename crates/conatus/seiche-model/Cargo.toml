[package]
rust-version = "1.97.1"
name = "seiche-model"
version = "0.0.1"
edition = "2024"
license.workspace = true
description = "The rapier-free model of seiche's layout physics: node keys, collider and material data, scene specs, arrangement roles, field clock, edge topology and the position-only layout view. Everything a host reads or names without running the engine."
repository = "https://github.com/merely-made/seiche"
keywords = ["physics", "layout", "graph", "force-directed"]
categories = ["graphics", "simulation"]

[lib]
path = "src/lib.rs"

[dependencies]
# NodeKey is petgraph's stable node index, as in seiche.
petgraph = "0.8"
euclid = "0.22"
# The field types a coupling descriptor names (numen carries serde itself).
numen = { path = "../numen", version = "0.2" }
# Role's wire form (seiche's `serde` feature forwards here).
serde = { version = "1", features = ["derive"], optional = true }

# The wire codec (`wire`): postcard, a compact varint format with no schema and
# no_std support, for the Worker's message boundary.
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde", "euclid/serde", "petgraph/serde-1"]
# `wire`: the messages between a host and a physics Worker, and their postcard codec.
wire = ["serde", "dep:postcard"]

[lints]
workspace = true
